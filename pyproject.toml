[project]
name = "docserver"
version = "0.1.0"
description = "Servidor de documentação para agentes (RAG local via MCP)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "python-docx>=1.1"]

[project.scripts]
docserver = "docserver.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "lento: testes que carregam o modelo real de embeddings (excluídos por padrão)",
]
addopts = "-m 'not lento'"
