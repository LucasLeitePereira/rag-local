# Conjunto de avaliação dos documentos de exemplo (docs-fonte/*.md).
#
# Campos:
#   pergunta  consulta enviada à busca
#   perfil    tecnico (termo exato) ou natural (linguagem do usuário)
#   esperado  caminho_origem do documento que responde; null = a documentação
#             não cobre o assunto (pergunta negativa: o ideal é resultado vazio)
#   trecho    opcional; frase que precisa estar num chunk do esperado no top-5.
#             Comparada sem acento, sem caixa e com espaços colapsados.
#
# Confira com `docserver avaliar avaliacao/perguntas.yaml --validar`.

